<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Chivo:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#06162D;--paper:#F8F6F6;--ink70:#384557;--ink40:#6A7381;--grey:#D9D9D9;--tint:#F0EDEE;--amber:#8a6320;--green:#2f6b56}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:'Open Sans',sans-serif;color:var(--navy)}
#iso{position:absolute;right:-260px;top:120px;width:820px;opacity:.07}
#iso svg{width:100%;height:auto;overflow:visible}
#banda{position:absolute;left:0;right:0;bottom:0;height:360px;background:var(--navy);transform-origin:bottom}
#cont{position:absolute;left:96px;right:96px;top:330px}
.chip{display:inline-block;background:var(--navy);color:var(--paper);font-family:'Chivo',sans-serif;font-weight:900;font-size:28px;letter-spacing:.16em;text-transform:uppercase;padding:14px 26px;border-radius:999px}
h1{font-size:78px;line-height:1.08;font-weight:800;margin:38px 0 60px;letter-spacing:-.01em}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:6px}
h1 .w>span{display:inline-block}
.diag{display:flex;align-items:center;gap:0;margin-bottom:70px}
.card{width:300px;height:170px;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:0 34px;box-sizing:border-box}
.card small{font-family:'Chivo',sans-serif;font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.card b{font-size:56px;font-weight:800;line-height:1.1}
.c1{background:#fff;border:3px solid var(--grey)} .c1 small{color:var(--ink40)}
.c2{background:var(--navy);color:var(--paper)} .c2 small{color:#9BA2AB}
.flecha{width:150px;height:6px;background:var(--navy);position:relative;transform-origin:left;margin:0 6px}
.flecha:after{content:'';position:absolute;right:-4px;top:-13px;border:16px solid transparent;border-left:22px solid var(--navy);border-right:0}
p{font-size:44px;line-height:1.4;margin:0 0 26px;color:var(--ink70)}
.marca{position:relative;display:inline;color:var(--navy);font-weight:700}
.meses{display:flex;gap:14px;margin:6px 0 64px}
.mes{width:62px;height:62px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-family:'Chivo',sans-serif;font-weight:900;font-size:24px;color:var(--ink40)}
.cierre{display:flex;gap:26px;align-items:flex-start;font-size:46px;font-weight:700;line-height:1.3;color:var(--navy)}
.tilde{flex:none;width:76px;height:76px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-top:2px}
#firma{position:absolute;left:96px;right:96px;bottom:120px;display:flex;align-items:center;justify-content:space-between}
#firma img{width:250px} #firma span{font-family:'Chivo',sans-serif;font-weight:700;font-size:26px;letter-spacing:.18em;text-transform:uppercase;color:#9BA2AB}
</style></head><body>
<div id="iso"><svg id="isotipo-mdo" data-name="Isotipo MDO" xmlns="http://www.w3.org/2000/svg" viewBox="430.26 409.45 219.50 261.09">   <defs></defs>   <g>     <path class="cls-2" fill="#06162d" d="M451.21,479.62c0-5.54.58-11.42,1.74-17.46,1.11-5.82,3.21-11.21,6.25-16,3-4.74,7.07-8.76,12.1-11.95,4.89-3.11,11.46-4.69,19.53-4.69s14.64,1.58,19.53,4.69c5.02,3.19,9.09,7.21,12.1,11.95,3.04,4.79,5.15,10.17,6.25,16,1.15,6.04,1.74,11.91,1.74,17.46v65.74h14.85v-65.74c0-5.54.58-11.42,1.74-17.46,1.11-5.83,3.21-11.21,6.25-16,3-4.73,7.07-8.75,12.1-11.95,4.89-3.11,11.46-4.69,19.53-4.69s14.64,1.58,19.53,4.69c5.02,3.19,9.09,7.21,12.1,11.95,3.04,4.78,5.14,10.17,6.25,16,1.15,6.04,1.73,11.92,1.73,17.46v65.74h13.58v-66.33c0-7.43-.84-14.84-2.48-22.04-1.68-7.38-4.58-14.13-8.6-20.05-4.1-6.04-9.65-10.95-16.52-14.6-6.87-3.65-15.48-5.5-25.59-5.5s-18.73,1.85-25.59,5.5c-6.87,3.65-12.43,8.56-16.52,14.6-1.9,2.79-3.54,5.77-4.93,8.93-1.39-3.15-3.03-6.13-4.93-8.92-4.1-6.04-9.65-10.95-16.52-14.6-6.87-3.65-15.48-5.5-25.59-5.5s-18.73,1.85-25.59,5.5c-6.87,3.65-12.43,8.56-16.52,14.6-4.02,5.92-6.92,12.67-8.6,20.05-1.65,7.2-2.48,14.61-2.48,22.04v66.33h13.58v-65.74Z"></path>     <path class="cls-2" fill="#06162d" d="M513.38,572.4c-5.81-3.7-12.44-6.35-19.69-7.9-7.11-1.52-14.44-2.3-21.79-2.3h-34.16v11.23h33.56c5.61,0,11.56.55,17.66,1.64,5.96,1.06,11.46,3.08,16.36,5.99,4.85,2.88,8.96,6.77,12.22,11.57,3.19,4.68,4.8,10.93,4.8,18.6s-1.61,13.92-4.8,18.6c-3.26,4.8-7.37,8.69-12.22,11.57-4.9,2.91-10.41,4.93-16.36,5.99-6.1,1.09-12.05,1.64-17.66,1.64h-33.56v11.23h34.16c7.34,0,14.67-.77,21.78-2.3,7.25-1.55,13.88-4.21,19.69-7.9,5.92-3.75,10.74-8.86,14.32-15.17,3.6-6.34,5.42-14.3,5.42-23.66s-1.82-17.32-5.42-23.66c-3.58-6.32-8.4-11.42-14.31-15.17Z"></path>     <path class="cls-2" fill="#06162d" d="M590.45,559.31c-28.63,0-51.92,23.29-51.92,51.92s23.29,51.92,51.92,51.92,51.92-23.29,51.92-51.92-23.29-51.92-51.92-51.92ZM590.45,642.96c-17.5,0-31.73-14.24-31.73-31.73s14.23-31.73,31.73-31.73,31.73,14.23,31.73,31.73-14.24,31.73-31.73,31.73Z"></path>   </g> </svg></div>
<div id="banda"></div>
<div id="cont">
  <span class="chip" id="chip">Laboral · RG 5907</span>
  <h1 id="tit">ARCA reglamentó el Fondo de Asistencia Laboral</h1>
  <div class="diag">
    <div class="card c1" id="c1"><small>Formulario</small><b>F.931</b></div>
    <div class="flecha" id="fl"></div>
    <div class="card c2" id="c2"><small>Se suma</small><b>+ FAL</b></div>
  </div>
  <p id="p1">La alícuota depende del <span class="marca">encuadre de cada empresa</span>. Un error ahí se arrastraría <b style="color:#06162D">todos los meses</b>.</p>
  <div class="meses" id="meses"></div>
  <div class="cierre" id="cie"><div class="tilde"><svg width="44" height="44" viewBox="0 0 44 44"><path id="tk" d="M8 23 L18 33 L37 12" fill="none" stroke="#F8F6F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>Antes de la próxima liquidación, revisaríamos el encuadre.</div></div>
</div>
<div id="firma"><img src="../../mdo-templates/assets/logo-mdo-principal-white.svg" alt=""><span>mdo-consultores.com.ar</span></div>
<script>
window.armar = () => {
  const T = 17000, A = [], ease = 'cubic-bezier(.2,0,.2,1)', sal = 'cubic-bezier(.16,1,.3,1)';
  const an = (el, kf, o) => A.push(el.animate(kf, Object.assign({ fill: 'both', easing: ease }, o)));
  const $ = (s) => document.querySelector(s);
  // Isotipo de fondo: se traza y queda de marca de agua que respira despacio.
  $('#iso svg').querySelectorAll('path,polygon,rect,circle').forEach((p) => { const L = p.getTotalLength(); p.style.stroke = '#06162D'; p.style.strokeWidth = 3; p.style.strokeDasharray = L;
    an(p, [{ strokeDashoffset: L, fillOpacity: 0 }, { strokeDashoffset: 0, fillOpacity: 0, offset: .7 }, { strokeDashoffset: 0, fillOpacity: 1 }], { duration: 1800, delay: 100 }); });
  an($('#iso'), [{ transform: 'translate(0,0)' }, { transform: 'translate(-40px,30px)' }], { duration: T, easing: 'linear' });
  an($('#banda'), [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 900, delay: 12600, easing: sal });
  an($('#chip'), [{ opacity: 0, transform: 'translateX(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 400, easing: sal });
  // Titular palabra por palabra, con máscara.
  const tit = $('#tit'); const pal = tit.textContent.split(' ');
  tit.innerHTML = pal.map((w) => '<span class="w"><span>' + w + '</span></span>').join(' ');
  tit.querySelectorAll('.w>span').forEach((s, i) => an(s, [{ transform: 'translateY(105%)' }, { transform: 'none' }], { duration: 800, delay: 900 + i * 70, easing: sal }));
  // Diagrama: el formulario, la flecha que se dibuja y el FAL que se suma.
  an($('#c1'), [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 2600, easing: sal });
  an($('#fl'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 700, delay: 3300, easing: ease });
  an($('#c2'), [{ opacity: 0, transform: 'translateX(-30px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: 3900, easing: sal });
  an($('#p1'), [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 5600 });
  // Los doce meses: se van marcando uno por uno ("se arrastraría todos los meses").
  const ms = $('#meses'); 'EFMAMJJASOND'.split('').forEach((l) => { const d = document.createElement('div'); d.className = 'mes'; d.textContent = l; ms.appendChild(d); });
  ms.querySelectorAll('.mes').forEach((d, i) => {
    an(d, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 7000 + i * 45, easing: sal });
    an(d, [{ background: '#F0EDEE', color: '#6A7381' }, { background: '#8a6320', color: '#F8F6F6' }], { duration: 260, delay: 7900 + i * 160 });
  });
  an($('#cie'), [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 10300, easing: sal });
  const tk = $('#tk'), L = tk.getTotalLength(); tk.style.strokeDasharray = L;
  an(tk, [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 600, delay: 10900 });
  an($('#firma'), [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 13100, easing: sal });
  A.forEach((a) => a.pause()); window.__anims = A; return T;
};
</script></body></html>
