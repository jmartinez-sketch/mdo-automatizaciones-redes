<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;gap:12px">
    <div style="flex:1;display:grid;place-items:center;background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-sm);padding:16px 22px"><img src="../assets/logos/logo-secundario-navy.svg" style="height:54px;max-width:100%" alt=""></div>
    <div style="flex:1;display:grid;place-items:center;background:var(--slate);border-radius:var(--r-sm);padding:16px 22px"><img src="../assets/logos/logo-secundario-navy.svg" style="height:54px;max-width:100%" alt=""></div>
  </div>
  <div style="border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:0 3px 3px 0;font-size:11.5px;color:var(--ink-70)">El nombre cambio: donde antes decia «& Asociados» ahora va «Gutierrez Taboada». Las 58 plantillas de redes todavia dicen el anterior.</div>
</div>
