<!-- @dsCard group="Forma" viewport="700x190" name="Filetes y profundidad" subtitle="No hay sistema de sombras: se separa con 1px y cambio de superficie" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.hex{font-family:var(--font-accent);font-weight:900;font-size:12.5px;letter-spacing:-.01em}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div style="display:flex;gap:16px">
  <div style="flex:1;display:flex;flex-direction:column;gap:9px">
    <div><div style="height:1px;background:var(--hair)"></div><span class="lbl">--hair · rgba(6,22,45,.14)</span></div>
    <div><div style="height:1px;background:var(--hair-2)"></div><span class="lbl">--hair-2 · rgba(6,22,45,.28)</span></div>
    <div style="background:var(--navy);padding:9px 10px;border-radius:var(--r-sm)"><div style="height:1px;background:rgba(248,246,246,.15)"></div><span class="lbl" style="color:var(--ink-35)">sobre navy · rgba(248,246,246,.15)</span></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:8px">
    <div style="background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-sm);padding:12px"><b style="font-family:var(--font-accent);font-size:13px">Tarjeta</b><div class="use">Filete de 1px, radio 3, sin sombra</div></div>
    <div style="background:var(--grey-pale);border-radius:var(--r-sm);padding:12px"><b style="font-family:var(--font-accent);font-size:13px">Superficie hundida</b><div class="use">Sin borde: el tono ya la separa</div></div>
  </div>
</div>
