<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div class="row">
  <div class="col" style="flex:1;align-items:center;gap:8px"><div style="width:100%;height:104px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-sm);padding:14px 18px"><img src="../assets/logos/isotipo-navy.svg" style="height:68px;width:auto;max-width:100%" alt=""></div><span class="lbl">sobre papel</span><span class="use" style="text-align:center">isotipo-navy.svg</span></div>
  <div class="col" style="flex:1;align-items:center;gap:8px"><div style="width:100%;height:104px;display:grid;place-items:center;background:var(--grey);border:1px solid var(--hair);border-radius:var(--r-sm);padding:14px 18px"><img src="../assets/logos/isotipo-navy.svg" style="height:68px;width:auto;max-width:100%" alt=""></div><span class="lbl">sobre gris claro</span><span class="use" style="text-align:center">mismo archivo</span></div>
  <div class="col" style="flex:1;align-items:center;gap:8px"><div style="width:100%;height:104px;display:grid;place-items:center;background:var(--navy);border:1px solid var(--hair);border-radius:var(--r-sm);padding:14px 18px"><img src="../assets/logos/isotipo-paper.svg" style="height:68px;width:auto;max-width:100%" alt=""></div><span class="lbl">sobre navy</span><span class="use" style="text-align:center">isotipo-paper.svg</span></div>
  <div class="col" style="flex:1;align-items:center;gap:8px"><div style="width:100%;height:104px;display:grid;place-items:center;background:var(--ground);border:1px solid var(--hair);border-radius:var(--r-sm);padding:14px 18px"><img src="../assets/logos/isotipo-fondo-navy.svg" style="height:90px;width:auto;max-width:100%" alt=""></div><span class="lbl">placa 1080x1080</span><span class="use" style="text-align:center">isotipo-fondo-navy.svg</span></div>
</div>
