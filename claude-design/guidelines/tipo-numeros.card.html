<!-- @dsCard group="Tipografia" viewport="700x190" name="Numeros" subtitle="Chivo 300 con tracking negativo: el numero pesa por tamano, no por grosor" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.hex{font-family:var(--font-accent);font-weight:900;font-size:12.5px;letter-spacing:-.01em}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div style="display:flex;align-items:flex-end;gap:30px">
  <div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--font-accent);font-weight:300;font-size:110px;letter-spacing:-.04em;line-height:.85;font-variant-numeric:tabular-nums;color:var(--navy)">+50</span><span style="font-family:var(--font-accent);font-weight:300;font-size:34px;color:var(--slate)">anos</span></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span class="lbl">Cifras tabulares siempre</span>
    <span class="use" style="max-width:34ch">2 digitos → 200px · 3 → 172px · 4 → 142px. En es-AR la coma es el separador decimal: <b>92,4%</b>.</span>
  </div>
</div>
