<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.hex{font-family:var(--font-accent);font-weight:900;font-size:12.5px}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div style="display:flex;flex-direction:column;gap:12px">
  <div class="row">
    <div class="col" style="flex:1"><div style="height:88px;border-radius:var(--r-sm);background:var(--gradient-navy)"></div><span class="lbl">--gradient-navy</span><span class="use">#00081d → #0a1a36 (55%) → #273f63. Es el fondo de las placas institucionales y de noticia.</span></div>
    <div class="col" style="flex:1"><div style="height:88px;border-radius:var(--r-sm);background:var(--gradient-light);border:1px solid var(--hair)"></div><span class="lbl">--gradient-light</span><span class="use">Brillo blanco en la esquina inferior izquierda que abre a #c2c6ce. Se usa en las placas de servicios.</span></div>
  </div>
  <div><div style="height:16px;border-radius:var(--r-sm);background:var(--gradient-navy-h)"></div><span class="lbl" style="display:block;margin-top:5px">--gradient-navy-h · versión horizontal, para filetes y barras</span></div>
</div>
