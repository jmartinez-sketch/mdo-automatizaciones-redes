<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:grid;place-items:center;background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-sm);padding:18px 28px"><img src="../assets/logos/logo-principal-navy.svg" style="height:62px" alt=""></div>
  <div style="display:flex;gap:12px">
    <div style="flex:1;display:grid;place-items:center;background:var(--navy);border-radius:var(--r-sm);padding:16px 24px"><img src="../assets/logos/logo-principal-paper.svg" style="height:48px" alt=""></div>
    <div style="flex:1;display:grid;place-items:center;background:var(--navy);border-radius:var(--r-sm);padding:16px 24px"><img src="../assets/logos/logo-principal-slate.svg" style="height:48px" alt=""></div>
  </div>
</div>
