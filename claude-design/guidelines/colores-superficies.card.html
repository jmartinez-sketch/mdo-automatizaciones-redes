<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.hex{font-family:var(--font-accent);font-weight:900;font-size:12.5px;letter-spacing:-.01em}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div class="row">
  <div class="col" style="flex:1"><div style="height:62px;background:#f1eeee;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="lbl">--ground</span><span class="use">Fondo de documento</span></div><div class="col" style="flex:1"><div style="height:62px;background:#f8f6f6;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="lbl">--surface-card</span><span class="use">Tarjeta y panel</span></div><div class="col" style="flex:1"><div style="height:62px;background:#eae8e8;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="lbl">--surface-sunken</span><span class="use">Fila agrupada, relleno</span></div><div class="col" style="flex:1"><div style="height:62px;background:#06162d;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="lbl">--surface-inverse</span><span class="use">Placa y cabecera de tabla</span></div>
</div>
