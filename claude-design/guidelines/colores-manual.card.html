<!-- @dsCard group="Colores" viewport="700x215" name="Paleta del manual" subtitle="Los cinco colores oficiales con su CMYK de imprenta, de la pagina de paleta del manual" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:20px 24px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}.row{display:flex;gap:14px;align-items:stretch}.col{display:flex;flex-direction:column;gap:6px}.lbl{font-family:var(--font-accent);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}.hex{font-family:var(--font-accent);font-weight:900;font-size:12.5px;letter-spacing:-.01em}.use{font-size:11px;color:var(--ink-70);line-height:1.35}</style>
<div class="row">
  <div class="col" style="flex:1"><div style="height:74px;background:#06162d;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="hex">#06162D</span><span class="lbl">--navy</span><span class="use">Azul noche</span><span class="use" style="color:var(--ink-35)">C100 M87 Y49 K67</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:#7c8392;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="hex">#7C8392</span><span class="lbl">--slate</span><span class="use">Gris azulado</span><span class="use" style="color:var(--ink-35)">C55 M40 Y29 K12</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:#6e6a6f;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="hex">#6E6A6F</span><span class="lbl">--warm-grey</span><span class="use">Gris calido</span><span class="use" style="color:var(--ink-35)">C54 M48 Y40 K28</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:#d9d9d9;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="hex">#D9D9D9</span><span class="lbl">--grey</span><span class="use">Gris claro</span><span class="use" style="color:var(--ink-35)">C18 M12 Y14 K0</span></div>
  <div class="col" style="flex:1"><div style="height:74px;background:#f8f6f6;border:1px solid var(--ink-15);border-radius:var(--r-sm)"></div><span class="hex">#F8F6F6</span><span class="lbl">--paper</span><span class="use">Blanco roto</span><span class="use" style="color:var(--ink-35)">sin CMYK — a confirmar</span></div>
</div>
